<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Shitaky Games">
  <title>Shitaky Games</title>
  <link rel="icon" type="image/png" href="./art/shitaky/mascot-plush-v1.png">
  <link rel="stylesheet" href="./styles.css?v=7">
  <script src="./settings.js?v=4" defer></script>
</head>
<body>
  <main class="game-shell" aria-label="Shitaky Games">
    <header class="site-header"><div class="header-inner">
      <a class="brand" href="./" aria-label="Shitaky Games home"><img src="./art/shitaky/mascot-plush-v1.png" alt=""><span>Shitaky Games</span></a>
      <div class="header-actions"><button class="settings-trigger" id="settings-trigger" type="button" aria-label="Settings" data-i18n-aria="settings"><span aria-hidden="true">⚙</span><span class="settings-label" data-i18n="settings">Settings</span></button></div>
    </div></header>
    <div class="site-content">
      <section class="empty-store" aria-labelledby="empty-title">
        <img src="./art/shitaky/mascot-plush-v1.png" alt="Shitaky, the red plush website mascot, waving with game tiles on its chest">
        <span class="empty-count" data-i18n="gameCount">0 games</span>
        <h1 id="empty-title" data-i18n="emptyTitle">No games here right now</h1>
        <p data-i18n="emptyDescription">Shitaky Games is empty for now.</p>
      </section>
      <footer class="site-footer"><a class="footer-brand" href="./"><img src="./art/shitaky/mascot-plush-v1.png" alt="">Shitaky Games</a></footer>
    </div>
    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title"><div class="settings-content">
      <div class="request-heading"><div><small>SHITAKY GAMES</small><h2 id="settings-title" data-i18n="settings">Settings</h2></div><button id="settings-close" class="request-close" type="button" aria-label="Close settings" data-i18n-aria="closeSettings">×</button></div>
      <p class="settings-intro" data-i18n="settingsIntro">Choose how Shitaky Games looks and controls. Your choices are saved on this device.</p>
      <label for="settings-language" data-i18n="language">Language</label>
      <select id="settings-language"><option value="auto" data-i18n="automatic">Automatic</option><option value="en">English</option><option value="ja">日本語</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option></select>
      <label for="settings-device" data-i18n="device">Controls / device</label>
      <select id="settings-device"><option value="auto" data-i18n="automatic">Automatic</option><option value="keyboard" data-i18n="keyboard">Keyboard</option><option value="touch" data-i18n="touch">Touch screen</option><option value="controller" data-i18n="controller">Controller</option></select>
      <p class="settings-device-status" id="settings-device-status" role="status"></p>
      <div class="settings-options"><label><input id="settings-large-text" type="checkbox"><span data-i18n="largeText">Larger text</span></label><label><input id="settings-high-contrast" type="checkbox"><span data-i18n="highContrast">High contrast</span></label><label><input id="settings-reduce-motion" type="checkbox"><span data-i18n="reduceMotion">Reduce motion</span></label></div>
      <div class="settings-actions"><button id="settings-fullscreen" type="button" data-i18n="fullscreen">Full screen</button><button id="settings-reset" type="button" data-i18n="resetSettings">Reset settings</button></div>
      <p class="settings-scope" data-i18n="settingsScope">These settings change Shitaky Games.</p>
    </div></dialog>
  </main>
</body>
</html>
