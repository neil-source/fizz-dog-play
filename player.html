<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4d97ff">
  <title>Play · Shitaky Games</title>
  <link rel="icon" type="image/png" href="./art/shitaky/icon.png?v=4">
  <link rel="stylesheet" href="./player.css?v=2">
  <script src="./player.js?v=2" defer></script>
</head>
<body>
  <main class="player-shell">
    <header class="player-bar">
      <a id="return-link" class="return-link" href="./"><span aria-hidden="true">←</span><span id="return-label">All games</span></a>
      <div class="game-heading"><img src="./art/shitaky/icon.png?v=4" alt=""><div><small>SHITAKY GAMES</small><strong id="game-title">Loading game…</strong></div></div>
      <nav class="player-actions" aria-label="Games">
        <button id="previous-game" class="step-button" type="button" aria-label="Previous game">‹</button>
        <details id="game-menu" class="game-menu"><summary id="menu-label">Games</summary><div id="game-list" class="game-list"></div></details>
        <button id="next-game" class="step-button" type="button" aria-label="Next game">›</button>
        <a id="open-direct" class="open-direct" href="./" target="_blank" rel="noopener noreferrer" aria-label="Open game in a new tab"><span aria-hidden="true">↗</span><span id="open-label">Open separately</span></a>
      </nav>
    </header>
    <div class="player-stage">
      <p id="loading-message" class="loading-message" role="status">Loading game…</p>
      <iframe id="game-frame" title="Game" allow="fullscreen; autoplay; gamepad; microphone; camera; clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
  </main>
</body>
</html>
